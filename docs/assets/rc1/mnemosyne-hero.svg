<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Mnemosyne — local-first AI memory and media workbench">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#101728"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A3350"/>
      <stop offset="0.5" stop-color="#5AA9E6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2A3350"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- thin graph grid -->
  <g stroke="#1A2030" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>
  <!-- checksum tick motif (media timeline marks) -->
  <g stroke="#E0A63C" stroke-width="3" stroke-linecap="round">
    <line x1="84" y1="52" x2="84" y2="68"/>
    <line x1="96" y1="56" x2="96" y2="64"/>
    <line x1="108" y1="50" x2="108" y2="70"/>
    <line x1="120" y1="56" x2="120" y2="64"/>
    <line x1="132" y1="54" x2="132" y2="66"/>
  </g>
  <!-- wordmark -->
  <text x="84" y="150" font-family="ui-sans-serif, system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#E6E9F0" letter-spacing="2">Mnemosyne</text>
  <text x="86" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#6CB6FF" letter-spacing="6">LOCAL-FIRST AI MEMORY &amp; MEDIA WORKBENCH</text>
  <!-- two tracks -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
    <rect x="84" y="228" width="470" height="52" rx="8" fill="#111527" stroke="#2A3350"/>
    <text x="104" y="259" fill="#9AA3B8">A · Second Brain v4</text>
    <text x="292" y="259" fill="#6CB6FF">private indexing · Qdrant · Hermes MCP</text>
    <rect x="570" y="228" width="626" height="52" rx="8" fill="#111527" stroke="#2A3350"/>
    <text x="590" y="259" fill="#9AA3B8">B · DIT 2.2</text>
    <text x="706" y="259" fill="#E0A63C">verified media · durable jobs · recoverable publication</text>
  </g>
  <rect x="0" y="0" width="1280" height="4" fill="url(#rule)"/>
  <text x="1196" y="304" font-family="ui-monospace, monospace" font-size="14" fill="#5A6478" text-anchor="end">developer preview · RC-1 · 2026-10</text>
</svg>
