<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Mnemosyne project mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#141C31"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#2A3350" stroke-width="4"/>
  <!-- M wordmark -->
  <text x="256" y="300" font-family="ui-serif, Georgia, serif" font-size="260" font-weight="700" fill="#E6E9F0" text-anchor="middle">M</text>
  <!-- media-timeline checksum ticks under the wordmark -->
  <g stroke="#E0A63C" stroke-width="10" stroke-linecap="round">
    <line x1="128" y1="356" x2="128" y2="384"/>
    <line x1="176" y1="368" x2="176" y2="372"/>
    <line x1="224" y1="352" x2="224" y2="388"/>
    <line x1="272" y1="368" x2="272" y2="372"/>
    <line x1="320" y1="364" x2="320" y2="376"/>
    <line x1="368" y1="358" x2="368" y2="382"/>
  </g>
  <!-- memory index nodes (cool cyan) -->
  <g fill="#6CB6FF">
    <circle cx="120" cy="112" r="10"/>
    <circle cx="256" cy="84" r="14"/>
    <circle cx="392" cy="112" r="10"/>
  </g>
  <g stroke="#2A3350" stroke-width="3">
    <line x1="120" y1="112" x2="256" y2="84"/>
    <line x1="256" y1="84" x2="392" y2="112"/>
  </g>
</svg>
